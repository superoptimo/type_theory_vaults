<svg viewBox="0 0 760 430" xmlns="http://www.w3.org/2000/svg" font-family="monospace" font-size="13">
  <style>
    .node { fill:#2b6cb0; stroke:#1a365d; stroke-width:1.5; }
    .label { fill:#e2e8f0; font-weight:bold; }
    .fwd { fill:#2f855a; }
    .bwd { fill:#c05621; }
    .edge { stroke:#718096; stroke-width:1.5; fill:none; }
    .cap { fill:#4a5568; }
  </style>

  <text x="20" y="20" class="cap" font-weight="bold">Forward pass (leaves → root)</text>
  <text x="440" y="20" class="cap" font-weight="bold">Backward pass (root → leaves)</text>

  <!-- forward tree -->
  <g transform="translate(30,40)">
    <circle cx="150" cy="30" r="26" class="node"/>
    <text x="150" y="35" text-anchor="middle" class="label">=</text>
    <text x="150" y="0" text-anchor="middle" class="fwd">[0,4]</text>

    <circle cx="60" cy="120" r="26" class="node"/>
    <text x="60" y="125" text-anchor="middle" class="label">v1</text>
    <text x="60" y="160" text-anchor="middle" class="fwd">[-1,4]</text>

    <circle cx="240" cy="120" r="26" class="node"/>
    <text x="240" y="125" text-anchor="middle" class="label">+</text>
    <text x="240" y="160" text-anchor="middle" class="fwd">[0,10]</text>

    <circle cx="200" cy="220" r="26" class="node"/>
    <text x="200" y="225" text-anchor="middle" class="label">×</text>
    <text x="200" y="260" text-anchor="middle" class="fwd">[-2,8]</text>

    <circle cx="280" cy="220" r="20" class="node"/>
    <text x="280" y="225" text-anchor="middle" class="label" font-size="11">2</text>

    <circle cx="160" cy="320" r="20" class="node"/>
    <text x="160" y="325" text-anchor="middle" class="label" font-size="11">2</text>

    <circle cx="240" cy="320" r="26" class="node"/>
    <text x="240" y="325" text-anchor="middle" class="label">v2</text>
    <text x="240" y="360" text-anchor="middle" class="fwd">[-1,4]</text>

    <path d="M135,45 L75,100" class="edge"/>
    <path d="M165,45 L225,100" class="edge"/>
    <path d="M225,240 L210,200" class="edge"/>
    <path d="M255,240 L270,200" class="edge"/>
    <path d="M185,240 L165,300" class="edge"/>
    <path d="M215,240 L235,300" class="edge"/>
  </g>

  <!-- backward tree -->
  <g transform="translate(440,40)">
    <circle cx="150" cy="30" r="26" class="node"/>
    <text x="150" y="35" text-anchor="middle" class="label">=</text>
    <text x="150" y="0" text-anchor="middle" class="bwd">[0,4]</text>

    <circle cx="60" cy="120" r="26" class="node"/>
    <text x="60" y="125" text-anchor="middle" class="label">v1</text>
    <text x="60" y="160" text-anchor="middle" class="bwd">[0,4]</text>

    <circle cx="240" cy="120" r="26" class="node"/>
    <text x="240" y="125" text-anchor="middle" class="label">+</text>
    <text x="240" y="160" text-anchor="middle" class="bwd">[0,4]</text>

    <circle cx="200" cy="220" r="26" class="node"/>
    <text x="200" y="225" text-anchor="middle" class="label">×</text>
    <text x="200" y="260" text-anchor="middle" class="bwd">[-2,2]</text>

    <circle cx="280" cy="220" r="20" class="node"/>
    <text x="280" y="225" text-anchor="middle" class="label" font-size="11">2</text>

    <circle cx="160" cy="320" r="20" class="node"/>
    <text x="160" y="325" text-anchor="middle" class="label" font-size="11">2</text>

    <circle cx="240" cy="320" r="26" class="node"/>
    <text x="240" y="325" text-anchor="middle" class="label">v2</text>
    <text x="240" y="360" text-anchor="middle" class="bwd">[-1,1]</text>

    <path d="M135,45 L75,100" class="edge"/>
    <path d="M165,45 L225,100" class="edge"/>
    <path d="M225,240 L210,200" class="edge"/>
    <path d="M255,240 L270,200" class="edge"/>
    <path d="M185,240 L165,300" class="edge"/>
    <path d="M215,240 L235,300" class="edge"/>
  </g>

  <text x="20" y="415" class="cap" font-size="12">green = forward-computed interval (arithmetic outward)</text>
  <text x="440" y="415" class="cap" font-size="12">orange = backward-narrowed interval (inverse-operator sweep)</text>
</svg>
