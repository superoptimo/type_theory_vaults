<svg viewBox="0 0 620 300" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, serif" font-size="15">
  <style>
    .rule { stroke:#666666; stroke-width:1.3; }
    .lbl { font-size:12px; fill:#555555; font-style:italic; }
    text { fill:#1a1a1a; }
  </style>
  <text x="240" y="20" text-anchor="middle">B ⊢ B</text>
  <line x1="200" y1="30" x2="330" y2="30" class="rule"/>
  <text x="335" y="34" class="lbl">init</text>

  <text x="240" y="55" text-anchor="middle">B ⊢ B, f</text>
  <line x1="170" y1="65" x2="360" y2="65" class="rule"/>
  <text x="365" y="69" class="lbl">wR</text>

  <text x="240" y="90" text-anchor="middle">⊢ B, B ⊃ f</text>
  <line x1="140" y1="100" x2="400" y2="100" class="rule"/>
  <text x="405" y="104" class="lbl">⊃R</text>

  <text x="270" y="125" text-anchor="middle">⊢ B, B ∨ (B ⊃ f)</text>
  <line x1="100" y1="135" x2="470" y2="135" class="rule"/>
  <text x="475" y="139" class="lbl">∨R</text>

  <text x="290" y="160" text-anchor="middle">⊢ B ∨ (B ⊃ f), B ∨ (B ⊃ f)</text>
  <line x1="70" y1="170" x2="530" y2="170" class="rule"/>
  <text x="535" y="174" class="lbl">∨R</text>

  <text x="300" y="195" text-anchor="middle">⊢ B ∨ (B ⊃ f), B ∨ (B ⊃ f)</text>
  <line x1="60" y1="205" x2="560" y2="205" class="rule"/>
  <text x="565" y="209" class="lbl">cR</text>

  <text x="300" y="230" text-anchor="middle">⊢ B ∨ (B ⊃ f)</text>
</svg>
